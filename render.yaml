# Render blueprint for the standalone engine API. Secrets are `sync: false` and are set
# in the Render dashboard (or via the API); never commit their values.
services:
  - type: web
    name: services-marketplace-engine
    runtime: node
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: PLATFORM_ADMIN_TOKEN
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: PUSH_PROVIDER
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKGROUND_CHECK_API_URL
        sync: false
      - key: BACKGROUND_CHECK_API_KEY
        sync: false
      - key: BACKGROUND_CHECK_MODE
        sync: false
      - key: ESIGN_API_URL
        sync: false
      - key: ESIGN_API_KEY
        sync: false
      - key: ESIGN_WEBHOOK_SECRET
        sync: false
